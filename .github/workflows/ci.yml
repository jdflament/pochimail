name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Required status checks (branch protection), names must stay stable:
  #   check (ubuntu-latest), check (macos-latest), check (windows-latest), eval
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # A gate that runs zero tasks must not pass (turbo exits 0 on "0 total").
      - name: Assert every gate runs tasks
        run: pnpm gates
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Knip
        run: pnpm knip
      - name: Manypkg
        run: pnpm manypkg

  # Unsigned packaging smoke build per OS (brief §5.9). The smoke also proves the encrypted WAL SQLite database with FTS5 inside the packaged app (M0-12). Runs on main, and on PRs that touch packaging inputs.
  # Not a required check: when a PR touches nothing relevant the job still runs and reports success, but every step after the scope check is skipped.
  package:
    name: package (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether packaging inputs changed
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          run=false
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            run=true
          elif [ "$EVENT" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git diff --name-only "$BASE_SHA" HEAD | grep -E '^apps/desktop/(build|packaging/|src/(main|worker)/|electron-builder\.config\.ts|package\.json)|^\.github/workflows/ci\.yml$|^pnpm-(lock|workspace)\.yaml$'; then
              run=true
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Linux packaging tools
        if: steps.scope.outputs.run == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm xvfb
      - name: Package
        if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @pochimail/desktop package
      - name: Smoke (fuses, headless launch, encrypted SQLite)
        if: steps.scope.outputs.run == 'true' && runner.os != 'Linux'
        run: pnpm --filter @pochimail/desktop package:smoke
      - name: Smoke (fuses, headless launch, encrypted SQLite)
        if: steps.scope.outputs.run == 'true' && runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm --filter @pochimail/desktop package:smoke
      - name: Report artifact sizes
        if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @pochimail/desktop package:size "${{ runner.os }} artifacts"
      - name: Upload artifacts
        if: steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pochimail-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
          retention-days: 7
          if-no-files-found: error

  # Stub until M1-11 wires the eval-regression run; keep the job name stable for branch protection.
  eval:
    name: eval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "eval-regression is wired in M1-11; passing as a stub."

  # Scans the pinned lockfile against OSV; any known vulnerability fails the job (superset of "critical").
  # Required check. Accepted risks live in osv-scanner.toml (time-boxed ignores with a reason).
  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=pnpm-lock.yaml
